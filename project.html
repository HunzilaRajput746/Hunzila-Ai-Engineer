<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details | Hunzila Nisar</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        :root {
            --bg-base: #110720;
            --bg-surface: rgba(255, 255, 255, 0.04);
            --primary: #8b5cf6;
            --primary-light: #c07eff;
            --violet-dark: #3c0366;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-base);
            color: #ffffff;
            font-family: 'Poppins', 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .back-btn {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 1000;
            background: rgba(17, 7, 32, 0.85);
            border: 1px solid var(--border);
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 9999px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .back-btn:hover {
            background: linear-gradient(135deg, var(--primary), #7f22fe);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);
        }

        /* Hero Section */
        .project-hero {
            position: relative;
            height: 65vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            padding: 80px 5%;
        }

        .project-hero-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.65);
        }

        .project-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, #110720 0%, rgba(17, 7, 32, 0.6) 60%, rgba(0,0,0,0.4) 100%);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .project-label {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(139, 92, 246, 0.2);
            color: var(--primary-light);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 0.05em;
        }

        .project-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            margin: 0;
            line-height: 1.15;
            color: #ffffff;
        }

        /* Content Section */
        .project-content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 5%;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 50px;
        }

        .main-col h3 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .main-col h3 i {
            color: var(--primary);
        }

        .desc-text {
            font-size: 1.05rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 40px;
        }

        .workflow-box {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            line-height: 1.8;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .workflow-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: linear-gradient(to bottom, var(--primary), #7f22fe);
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .tech-stack {
            background: var(--bg-surface);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .tech-stack h4 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            color: #ffffff;
        }

        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tech-tags span {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 6px 14px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--primary-light);
            transition: all 0.2s ease;
        }

        .tech-tags span:hover {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.3);
            transform: translateY(-2px);
        }

        .features-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .features-list li {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .features-list li:last-child {
            border-bottom: none;
        }

        .features-list li i {
            color: var(--primary);
            margin-top: 4px;
        }

        /* Gallery */
        .project-gallery {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 5% 80px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .gallery-item {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            height: 380px;
            background: #020618;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.04);
        }

        /* Giant Footer */
        .giant-footer {
            margin-top: 30px;
            padding: 100px 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            background: rgba(17, 7, 32, 0.9);
        }

        .giant-footer h1 {
            font-size: clamp(1.5rem, 3.5vw, 2.75rem);
            font-weight: 800;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.25);
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }

        .giant-footer h1:hover {
            color: var(--primary-light);
            -webkit-text-stroke: 0px;
            text-shadow: 0 0 35px rgba(139, 92, 246, 0.6);
        }

        .error-msg {
            text-align: center;
            padding: 150px 20px;
            font-size: 1.8rem;
            color: var(--primary-light);
        }

        @media (max-width: 900px) {
            .project-content-wrapper {
                grid-template-columns: 1fr;
            }
            .project-gallery { grid-template-columns: 1fr; }
            .gallery-item { height: 280px; }
            .back-btn { top: 15px; left: 15px; padding: 8px 16px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <a href="index.html#projects" class="back-btn" id="backBtn">
        <i class="fas fa-arrow-left"></i> Back to Portfolio
    </a>

    <div id="app">
        <!-- Injected by JS -->
    </div>

    <!-- Data & Scripts -->
    <script src="data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');
            const app = document.getElementById('app');

            if (!projectId || !projectsData[projectId]) {
                app.innerHTML = '<div class="error-msg">Project not found. <br><br> <a href="index.html#projects" style="color:#c07eff; text-decoration:underline; font-size:1.1rem;">Return to Portfolio</a></div>';
                return;
            }

            const data = projectsData[projectId];

            // Curated pool of gallery images
            const fallbackGallery = [
                'images/projects/revenue-analytics.png',
                'images/projects/revenue-tasks.png',
                'images/projects/revenue-dashboard.png',
                'images/projects/c17-dashboard.jpg',
                'images/projects/helmet.jpg',
                'images/projects/cancer.jpg',
                'images/projects/workflow.jpg',
                'images/projects/orbitwork-employer-dashboard.png',
                'images/projects/orbitwork-candidate-dashboard.png'
            ];

            const allImages = (data.gallery && data.gallery.length > 1) ? data.gallery : fallbackGallery;
            const filteredImages = allImages.filter(img => img !== data.img);
            const displayImg1 = filteredImages[0] || data.img;
            const displayImg2 = filteredImages[1] || filteredImages[0] || data.img;

            // Build HTML
            app.innerHTML = `
                <!-- Hero Section -->
                <section class="project-hero">
                    <img src="${data.img}" alt="${data.title}" class="project-hero-bg" id="heroBg">
                    <div class="project-hero-overlay"></div>
                    <div class="hero-content">
                        <div class="project-label gs-reveal">${data.label}</div>
                        <h1 class="project-title gs-reveal">${data.title}</h1>
                    </div>
                </section>

                <!-- Content Layout -->
                <section class="project-content-wrapper">
                    <!-- Left Column: Description & Workflow -->
                    <div class="main-col">
                        <h3 class="gs-reveal"><i class="fas fa-align-left"></i> System Overview</h3>
                        <p class="desc-text gs-reveal">${data.desc}</p>
                        
                        <h3 class="gs-reveal" style="margin-top: 50px;"><i class="fas fa-network-wired"></i> Architecture &amp; Workflow</h3>
                        <div class="workflow-box gs-reveal">
                            <p>${data.workflow}</p>
                        </div>
                    </div>

                    <!-- Right Column: Tech & Features -->
                    <div class="sidebar">
                        <div class="tech-stack gs-reveal">
                            <h4>Technologies Used</h4>
                            <div class="tech-tags">
                                ${data.tech.map(t => `<span>${t}</span>`).join('')}
                            </div>
                        </div>

                        <div class="tech-stack gs-reveal">
                            <h4>Production Highlights</h4>
                            <ul class="features-list">
                                <li><i class="fas fa-check-circle"></i> Built &amp; tested for high reliability and live client production.</li>
                                <li><i class="fas fa-check-circle"></i> Deployed on self-managed VPS infrastructure via Tailscale.</li>
                                <li><i class="fas fa-check-circle"></i> AI integrations and custom automated event workflows.</li>
                                <li><i class="fas fa-check-circle"></i> Responsive, modern dark UI crafted with state-of-the-art standards.</li>
                            </ul>
                        </div>
                    </div>
                </section>

                <!-- Gallery -->
                <section class="project-gallery">
                    <div class="gallery-item gs-reveal">
                        <img src="${displayImg1}" alt="Project View 1">
                    </div>
                    <div class="gallery-item gs-reveal">
                        <img src="${displayImg2}" alt="Project View 2">
                    </div>
                </section>

                <!-- Giant Footer -->
                <div class="giant-footer gs-reveal">
                    <h1>DESIGNED &amp; DEVELOPED BY HUNZILA NISAR</h1>
                </div>
            `;

            // GSAP Animations
            if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
                gsap.registerPlugin(ScrollTrigger);

                gsap.to('#heroBg', {
                    yPercent: 25,
                    ease: 'none',
                    scrollTrigger: {
                        trigger: '.project-hero',
                        start: 'top top',
                        end: 'bottom top',
                        scrub: true
                    }
                });

                gsap.from('.gs-reveal', {
                    y: 40,
                    opacity: 0,
                    duration: 1,
                    stagger: 0.1,
                    ease: 'power3.out',
                    scrollTrigger: {
                        trigger: '.project-content-wrapper',
                        start: 'top 85%'
                    }
                });
            }
        });
    </script>
</body>
</html>
